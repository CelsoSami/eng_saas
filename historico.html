<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historico - TerraeScope</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><a href="dashboard.html" class="sidebar-logo"><div class="icon"><i class="fas fa-building"></i></div> TerraeScope</a></div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Principal</div>
                    <a href="dashboard.html" class="nav-item"><span class="icon"><i class="fas fa-th-large"></i></span> Dashboard</a>
                    <a href="busca.html" class="nav-item"><span class="icon"><i class="fas fa-search"></i></span> Buscar Terrenos <span class="badge" id="quota-badge">10</span></a>
                    <a href="mapa.html" class="nav-item"><span class="icon"><i class="fas fa-map-marked-alt"></i></span> Mapa Interativo</a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Analises</div>
                    <a href="analise.html" class="nav-item"><span class="icon"><i class="fas fa-chart-bar"></i></span> Analise de Terreno</a>
                    <a href="comparativo.html" class="nav-item"><span class="icon"><i class="fas fa-balance-scale"></i></span> Comparativo</a>
                    <a href="bi.html" class="nav-item"><span class="icon"><i class="fas fa-chart-line"></i></span> BI & Relatorios <span class="badge tag-beige">PRO</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Gestao</div>
                    <a href="projetos.html" class="nav-item"><span class="icon"><i class="fas fa-folder-open"></i></span> Meus Projetos</a>
                    <a href="favoritos.html" class="nav-item"><span class="icon"><i class="fas fa-heart"></i></span> Favoritos</a>
                    <a href="historico.html" class="nav-item active"><span class="icon"><i class="fas fa-history"></i></span> Historico</a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Conta</div>
                    <a href="assinatura.html" class="nav-item"><span class="icon"><i class="fas fa-crown"></i></span> Assinatura</a>
                    <a href="config.html" class="nav-item"><span class="icon"><i class="fas fa-cog"></i></span> Configuracoes</a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar" id="user-avatar">US</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="user-name">Usuario</div>
                        <div class="sidebar-user-plan" id="user-plan">Plano Gratuito</div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button class="header-btn" onclick="toggleSidebar()" style="display:none;" id="menu-toggle"><i class="fas fa-bars"></i></button>
                    <div>
                        <h1 class="header-title">Historico</h1>
                        <div class="header-breadcrumb"><a href="dashboard.html">Inicio</a> <i class="fas fa-chevron-right" style="font-size:10px;"></i> Historico</div>
                    </div>
                </div>
                <div class="header-right">
                    <button class="btn btn-ghost btn-sm" onclick="limparHistorico()"><i class="fas fa-trash"></i> Limpar</button>
                </div>
            </header>

            <div class="page-content">
                <div id="historico-container"></div>
            </div>
        </main>
    </div>

    <div id="alert-container" style="position:fixed; top:20px; right:20px; z-index:9999;"></div>

    <script src="db.js"></script>
    <script src="license.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await db.init();
            const sessao = await license.verificarSessao();
            if (!sessao) { window.location.href = 'index.html'; return; }
            updateUserUI();
            loadHistorico();
            checkResponsive();
        });

        function updateUserUI() {
            const user = license.usuarioAtual;
            const plano = license.getPlanoInfo();
            if (user) {
                document.getElementById('user-name').textContent = user.nome || 'Usuario';
                document.getElementById('user-avatar').textContent = (user.nome || 'US').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                document.getElementById('user-plan').textContent = 'Plano ' + plano.nome;
                document.getElementById('quota-badge').textContent = plano.limiteBuscas === -1 ? '∞' : plano.limiteBuscas;
            }
        }

        async function loadHistorico() {
            const registros = await db.getAll('historico');
            const container = document.getElementById('historico-container');

            if (registros.length === 0) {
                container.innerHTML = '<div class="empty-state" style="padding:60px 20px;"><div class="empty-state-icon"><i class="fas fa-history"></i></div><h3>Sem historico</h3><p>Suas buscas e analises aparecerao aqui</p></div>';
                return;
            }

            const sorted = registros.sort((a, b) => new Date(b.criadoEm) - new Date(a.criadoEm));

            // Group by date
            const groups = {};
            sorted.forEach(r => {
                const date = new Date(r.criadoEm).toLocaleDateString('pt-BR');
                if (!groups[date]) groups[date] = [];
                groups[date].push(r);
            });

            let html = '<div style="position:relative; padding-left:30px;">';
            html += '<div style="position:absolute; left:14px; top:0; bottom:0; width:2px; background:var(--border);"></div>';

            Object.keys(groups).forEach(date => {
                html += '<div style="margin-bottom:24px;">';
                html += '<div style="position:relative; font-size:13px; font-weight:700; color:var(--text-secondary); margin-bottom:12px; padding-left:24px;">' + date;
                html += '<div style="position:absolute; left:-22px; top:4px; width:12px; height:12px; border-radius:50%; background:var(--neon-blue); border:2px solid var(--bg-primary);"></div></div>';

                groups[date].forEach(r => {
                    const icons = { 'analise': 'chart-bar', 'busca': 'search', 'projeto': 'folder' };
                    const colors = { 'analise': 'var(--neon-blue)', 'busca': 'var(--neon-green)', 'projeto': 'var(--neon-beige)' };
                    const tipo = r.tipo || 'busca';
                    const icon = icons[tipo] || 'circle';
                    const color = colors[tipo] || 'var(--text-muted)';
                    const time = new Date(r.criadoEm).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                    const link = r.terrenoId ? 'analise.html?terreno=' + r.terrenoId : '#';

                    html += '<div style="position:relative; display:flex; align-items:center; gap:12px; padding:12px 16px; margin-bottom:8px; background:var(--bg-tertiary); border-radius:10px; cursor:pointer;" onclick="window.location.href=\'' + link + '\'">';
                    html += '<div style="width:32px; height:32px; border-radius:8px; background:' + color + '22; display:grid; place-items:center; color:' + color + '; font-size:14px;"><i class="fas fa-' + icon + '"></i></div>';
                    html += '<div style="flex:1;"><div style="font-size:14px; font-weight:500;">' + (r.logradouro || r.tipo || 'Atividade') + '</div>';
                    html += '<div style="font-size:12px; color:var(--text-muted);">' + tipo.charAt(0).toUpperCase() + tipo.slice(1) + '</div></div>';
                    html += '<div style="font-size:12px; color:var(--text-muted);">' + time + '</div>';
                    html += '<i class="fas fa-chevron-right" style="color:var(--text-muted); font-size:11px;"></i>';
                    html += '</div>';
                });

                html += '</div>';
            });

            html += '</div>';
            container.innerHTML = html;
        }

        async function limparHistorico() {
            if (!confirm('Tem certeza que deseja limpar todo o historico?')) return;
            const registros = await db.getAll('historico');
            for (const r of registros) { await db.delete('historico', r.id); }
            showAlert('Historico limpo', 'success');
            loadHistorico();
        }

        function showAlert(message, type = 'info') {
            const container = document.getElementById('alert-container');
            const icons = { info: 'info-circle', success: 'check-circle', danger: 'exclamation-circle', warning: 'exclamation-triangle' };
            const alert = document.createElement('div');
            alert.className = 'alert alert-' + type;
            alert.innerHTML = '<i class="fas fa-' + icons[type] + '"></i> ' + message;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function checkResponsive() {
            const toggle = document.getElementById('menu-toggle');
            if (window.innerWidth <= 768) { toggle.style.display = 'grid'; } else { toggle.style.display = 'none'; }
        }
        window.addEventListener('resize', checkResponsive);
    </script>
</body>
</html>

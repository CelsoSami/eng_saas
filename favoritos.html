<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos - TerraeScope</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><a href="dashboard.html" class="sidebar-logo"><div class="icon"><i class="fas fa-building"></i></div> TerraeScope</a></div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Principal</div>
                    <a href="dashboard.html" class="nav-item"><span class="icon"><i class="fas fa-th-large"></i></span> Dashboard</a>
                    <a href="busca.html" class="nav-item"><span class="icon"><i class="fas fa-search"></i></span> Buscar Terrenos <span class="badge" id="quota-badge">10</span></a>
                    <a href="mapa.html" class="nav-item"><span class="icon"><i class="fas fa-map-marked-alt"></i></span> Mapa Interativo</a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Analises</div>
                    <a href="analise.html" class="nav-item"><span class="icon"><i class="fas fa-chart-bar"></i></span> Analise de Terreno</a>
                    <a href="comparativo.html" class="nav-item"><span class="icon"><i class="fas fa-balance-scale"></i></span> Comparativo</a>
                    <a href="bi.html" class="nav-item"><span class="icon"><i class="fas fa-chart-line"></i></span> BI & Relatorios <span class="badge tag-beige">PRO</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Gestao</div>
                    <a href="projetos.html" class="nav-item"><span class="icon"><i class="fas fa-folder-open"></i></span> Meus Projetos</a>
                    <a href="favoritos.html" class="nav-item active"><span class="icon"><i class="fas fa-heart"></i></span> Favoritos</a>
                    <a href="historico.html" class="nav-item"><span class="icon"><i class="fas fa-history"></i></span> Historico</a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Conta</div>
                    <a href="assinatura.html" class="nav-item"><span class="icon"><i class="fas fa-crown"></i></span> Assinatura</a>
                    <a href="config.html" class="nav-item"><span class="icon"><i class="fas fa-cog"></i></span> Configuracoes</a>
                    <a href="#" class="nav-item" onclick="event.preventDefault(); license.logout();"><span class="icon"><i class="fas fa-sign-out-alt"></i></span> Sair</a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar" id="user-avatar">US</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="user-name">Usuario</div>
                        <div class="sidebar-user-plan" id="user-plan">Plano Gratuito</div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button class="header-btn" onclick="toggleSidebar()" style="display:none;" id="menu-toggle"><i class="fas fa-bars"></i></button>
                    <div>
                        <h1 class="header-title">Favoritos</h1>
                        <div class="header-breadcrumb"><a href="dashboard.html">Inicio</a> <i class="fas fa-chevron-right" style="font-size:10px;"></i> Favoritos</div>
                    </div>
                </div>
                <div class="header-right">
                    <span style="font-size:13px; color:var(--text-muted);" id="fav-count">0 terrenos favoritados</span>
                </div>
            </header>

            <div class="page-content">
                <div id="favoritos-container"></div>
            </div>
        </main>
    </div>

    <div id="alert-container" style="position:fixed; top:20px; right:20px; z-index:9999;"></div>

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>
    <script src="license.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await db.init();
            const sessao = await license.verificarSessao();
            if (!sessao) { window.location.href = 'index.html'; return; }
            updateUserUI();
            loadFavoritos();
            checkResponsive();
        });

        function updateUserUI() {
            const user = license.usuarioAtual;
            const plano = license.getPlanoInfo();
            if (user) {
                document.getElementById('user-name').textContent = user.nome || 'Usuario';
                document.getElementById('user-avatar').textContent = (user.nome || 'US').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                document.getElementById('user-plan').textContent = 'Plano ' + plano.nome;
                document.getElementById('quota-badge').textContent = plano.limiteBuscas === -1 ? '∞' : plano.limiteBuscas;
            }
        }

        async function loadFavoritos() {
            const terrenos = await db.getAll('terrenos');
            const favoritos = terrenos.filter(t => t.favorito);
            const container = document.getElementById('favoritos-container');
            document.getElementById('fav-count').textContent = favoritos.length + ' terreno(s) favoritado(s)';

            if (favoritos.length === 0) {
                container.innerHTML = '<div class="empty-state" style="padding:60px 20px;"><div class="empty-state-icon"><i class="fas fa-heart"></i></div><h3>Nenhum favorito ainda</h3><p>Favorite terrenos na busca ou analise para visualiza-los aqui</p><a href="busca.html" class="btn btn-primary" style="margin-top:12px;"><i class="fas fa-search"></i> Buscar terrenos</a></div>';
                return;
            }

            container.innerHTML = '<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px;">' + favoritos.map(t => '<div class="card" style="cursor:pointer;" onclick="window.location.href=\'analise.html?terreno=' + t.id + '\'">' +
                '<div style="display:flex; align-items:center; gap:12px; margin-bottom:16px;">' +
                '<div style="width:44px; height:44px; border-radius:10px; background:var(--neon-green-dim); display:grid; place-items:center; color:var(--neon-green); font-size:18px;"><i class="fas fa-map-pin"></i></div>' +
                '<div style="flex:1; min-width:0;"><div style="font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + (t.logradouro || 'Sem endereco') + '</div>' +
                '<div style="font-size:12px; color:var(--text-muted);">' + (t.cidade || '') + ' - ' + (t.uf || '') + '</div></div>' +
                '<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); desfavoritar(' + t.id + ')" title="Remover dos favoritos"><i class="fas fa-heart" style="color:var(--neon-red);"></i></button>' +
                '</div>' +
                '<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; font-size:13px;">' +
                '<div><span style="color:var(--text-muted);">Area:</span> <strong>' + (t.area || '—') + ' m2</strong></div>' +
                '<div><span style="color:var(--text-muted);">CEP:</span> <strong>' + (t.cep || '—') + '</strong></div>' +
                '<div><span style="color:var(--text-muted);">Zona:</span> <span class="tag tag-blue" style="padding:2px 8px;">' + (t.zona || '—') + '</span></div>' +
                '<div><span style="color:var(--text-muted);">Matricula:</span> <strong>' + (t.matricula || '—') + '</strong></div>' +
                '</div>' +
                (t.valor_mercado ? '<div style="margin-top:16px; padding-top:12px; border-top:1px solid var(--border); font-size:14px; color:var(--neon-green); font-weight:600;">R$ ' + Number(t.valor_mercado).toLocaleString('pt-BR') + '</div>' : '') +
                '</div>').join('') + '</div>';
        }

        async function desfavoritar(id) {
            const terreno = await db.get('terrenos', id);
            if (terreno) {
                terreno.favorito = false;
                await db.update('terrenos', terreno);
                showAlert('Removido dos favoritos', 'success');
                loadFavoritos();
            }
        }

        function showAlert(message, type = 'info') {
            const container = document.getElementById('alert-container');
            const icons = { info: 'info-circle', success: 'check-circle', danger: 'exclamation-circle', warning: 'exclamation-triangle' };
            const alert = document.createElement('div');
            alert.className = 'alert alert-' + type;
            alert.innerHTML = '<i class="fas fa-' + icons[type] + '"></i> ' + message;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function checkResponsive() {
            const toggle = document.getElementById('menu-toggle');
            if (window.innerWidth <= 768) { toggle.style.display = 'grid'; } else { toggle.style.display = 'none'; }
        }
        window.addEventListener('resize', checkResponsive);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Projetos - TerraeScope</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header"><a href="dashboard.html" class="sidebar-logo"><div class="icon"><i class="fas fa-building"></i></div> TerraeScope</a></div>
            <nav class="sidebar-nav">
                <div class="nav-section">
                    <div class="nav-section-title">Principal</div>
                    <a href="dashboard.html" class="nav-item"><span class="icon"><i class="fas fa-th-large"></i></span> Dashboard</a>
                    <a href="busca.html" class="nav-item"><span class="icon"><i class="fas fa-search"></i></span> Buscar Terrenos <span class="badge" id="quota-badge">10</span></a>
                    <a href="mapa.html" class="nav-item"><span class="icon"><i class="fas fa-map-marked-alt"></i></span> Mapa Interativo</a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Análises</div>
                    <a href="analise.html" class="nav-item"><span class="icon"><i class="fas fa-chart-bar"></i></span> Análise de Terreno</a>
                    <a href="comparativo.html" class="nav-item"><span class="icon"><i class="fas fa-balance-scale"></i></span> Comparativo</a>
                    <a href="bi.html" class="nav-item"><span class="icon"><i class="fas fa-chart-line"></i></span> BI & Relatórios <span class="badge tag-beige">PRO</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Gestão</div>
                    <a href="projetos.html" class="nav-item active"><span class="icon"><i class="fas fa-folder-open"></i></span> Meus Projetos</a>
                    <a href="favoritos.html" class="nav-item"><span class="icon"><i class="fas fa-heart"></i></span> Favoritos</a>
                    <a href="historico.html" class="nav-item"><span class="icon"><i class="fas fa-history"></i></span> Histórico</a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">Conta</div>
                    <a href="assinatura.html" class="nav-item"><span class="icon"><i class="fas fa-crown"></i></span> Assinatura</a>
                    <a href="config.html" class="nav-item"><span class="icon"><i class="fas fa-cog"></i></span> Configurações</a>
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar" id="user-avatar">US</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name" id="user-name">Usuário</div>
                        <div class="sidebar-user-plan" id="user-plan">Plano Gratuito</div>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button class="header-btn" onclick="toggleSidebar()" style="display:none;" id="menu-toggle"><i class="fas fa-bars"></i></button>
                    <div>
                        <h1 class="header-title">Meus Projetos</h1>
                        <div class="header-breadcrumb"><a href="dashboard.html">Início</a> <i class="fas fa-chevron-right" style="font-size:10px;"></i> Projetos</div>
                    </div>
                </div>
                <div class="header-right">
                    <button class="btn btn-primary btn-sm" onclick="abrirModalNovo()"><i class="fas fa-plus"></i> Novo Projeto</button>
                </div>
            </header>

            <div class="page-content">
                <!-- Lista de projetos -->
                <div id="projetos-lista"></div>

                <!-- Detalhe do projeto -->
                <div id="projeto-detalhe" style="display:none;">
                    <button class="btn btn-ghost btn-sm" onclick="voltarLista()" style="margin-bottom:16px;"><i class="fas fa-arrow-left"></i> Voltar</button>
                    <div class="card" style="margin-bottom:24px;">
                        <div class="card-header">
                            <div>
                                <div class="card-title" id="det-nome">—</div>
                                <div class="card-subtitle" id="det-descricao">—</div>
                            </div>
                            <div style="display:flex; gap:8px;">
                                <select class="form-select" id="det-status" style="width:auto;" onchange="mudarStatus()">
                                    <option value="em andamento">Em andamento</option>
                                    <option value="concluido">Concluído</option>
                                    <option value="pausado">Pausado</option>
                                </select>
                                <button class="btn btn-ghost btn-sm" style="color:var(--neon-red);" onclick="excluirProjeto()"><i class="fas fa-trash"></i></button>
                            </div>
                        </div>
                    </div>
                    <h3 style="font-size:16px; font-weight:600; margin-bottom:12px;">Terrenos do Projeto</h3>
                    <div id="det-terrenos"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Novo Projeto -->
    <div class="modal-overlay" id="modal-novo">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Novo Projeto</h3>
                <button class="modal-close" onclick="fecharModal('modal-novo')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Nome do Projeto *</label>
                    <input type="text" class="form-input" id="novoNome" placeholder="Ex: Residencial Vista Verde">
                </div>
                <div class="form-group">
                    <label class="form-label">Descrição</label>
                    <textarea class="form-textarea" id="novoDescricao" rows="3" placeholder="Descreva o objetivo do projeto..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="fecharModal('modal-novo')">Cancelar</button>
                <button class="btn btn-primary" onclick="criarProjeto()"><i class="fas fa-save"></i> Criar</button>
            </div>
        </div>
    </div>

    <div id="alert-container" style="position:fixed; top:20px; right:20px; z-index:9999;"></div>

    <script src="../js/db.js"></script>
    <script src="../js/license.js"></script>
    <script>
        let projetoAtual = null;

        document.addEventListener('DOMContentLoaded', async () => {
            await db.init();
            const sessao = await license.verificarSessao();
            if (!sessao) { window.location.href = '../index.html'; return; }
            updateUserUI();
            loadProjetos();
            checkResponsive();
        });

        function updateUserUI() {
            const user = license.usuarioAtual;
            const plano = license.getPlanoInfo();
            if (user) {
                document.getElementById('user-name').textContent = user.nome || 'Usuário';
                document.getElementById('user-avatar').textContent = (user.nome || 'US').split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
                document.getElementById('user-plan').textContent = 'Plano ' + plano.nome;
                document.getElementById('quota-badge').textContent = plano.limiteBuscas === -1 ? '∞' : plano.limiteBuscas;
            }
        }

        async function loadProjetos() {
            const projetos = await db.getAll('projetos');
            const container = document.getElementById('projetos-lista');
            if (projetos.length === 0) {
                container.innerHTML = `<div class="empty-state" style="padding:60px 20px;"><div class="empty-state-icon"><i class="fas fa-folder-open"></i></div><h3>Nenhum projeto</h3><p>Crie seu primeiro projeto para organizar seus terrenos</p><button class="btn btn-primary" onclick="abrirModalNovo()" style="margin-top:12px;"><i class="fas fa-plus"></i> Criar Projeto</button></div>`;
                return;
            }
            container.innerHTML = `<div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:16px;">${projetos.map(p => {
                const statusColors = { 'em andamento': 'var(--neon-blue)', 'concluido': 'var(--neon-green)', 'pausado': 'var(--neon-beige)' };
                const statusLabels = { 'em andamento': 'Em andamento', 'concluido': 'Concluído', 'pausado': 'Pausado' };
                const st = p.status || 'em andamento';
                return `<div class="card" style="cursor:pointer; border-left:3px solid ${statusColors[st] || 'var(--neon-blue)'};" onclick="verProjeto(${p.id})">
                    <div style="display:flex; align-items:center; gap:12px; margin-bottom:12px;">
                        <div style="width:44px; height:44px; border-radius:10px; background:var(--neon-beige-dim); display:grid; place-items:center; color:var(--neon-beige); font-size:18px;"><i class="fas fa-folder"></i></div>
                        <div style="flex:1;"><div style="font-size:15px; font-weight:600;">${p.nome}</div><div style="font-size:12px; color:var(--text-muted);">${p.descricao || 'Sem descrição'}</div></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; font-size:12px;">
                        <span class="tag" style="background:${statusColors[st]}22; color:${statusColors[st]}; padding:3px 10px; border-radius:12px;">${statusLabels[st]}</span>
                        <span style="color:var(--text-muted);">${(p.terrenoIds || []).length} terreno(s)</span>
                    </div>
                </div>`;
            }).join('')}</div>`;
        }

        async function verProjeto(id) {
            projetoAtual = await db.get('projetos', id);
            if (!projetoAtual) return;
            document.getElementById('projetos-lista').style.display = 'none';
            document.getElementById('projeto-detalhe').style.display = 'block';
            document.getElementById('det-nome').textContent = projetoAtual.nome;
            document.getElementById('det-descricao').textContent = projetoAtual.descricao || 'Sem descrição';
            document.getElementById('det-status').value = projetoAtual.status || 'em andamento';

            const terrenosContainer = document.getElementById('det-terrenos');
            const terrenoIds = projetoAtual.terrenoIds || [];
            if (terrenoIds.length === 0) { terrenosContainer.innerHTML = '<div class="empty-state" style="padding:30px;"><p style="margin:0; font-size:13px;">Nenhum terreno neste projeto</p></div>'; return; }

            let html = '';
            for (const tid of terrenoIds) {
                const t = await db.get('terrenos', tid);
                if (!t) continue;
                html += `<a href="analise.html?terreno=${t.id}" style="display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid var(--border); text-decoration:none; color:inherit;">
                    <div style="width:36px; height:36px; border-radius:8px; background:var(--neon-green-dim); display:grid; place-items:center; color:var(--neon-green); font-size:14px;"><i class="fas fa-map-pin"></i></div>
                    <div style="flex:1;"><div style="font-weight:500; font-size:14px;">${t.logradouro || '—'}</div><div style="font-size:12px; color:var(--text-muted);">${t.cidade || ''} - ${t.uf || ''}</div></div>
                    <i class="fas fa-chevron-right" style="color:var(--text-muted); font-size:12px;"></i>
                </a>`;
            }
            terrenosContainer.innerHTML = html;
        }

        function voltarLista() {
            projetoAtual = null;
            document.getElementById('projetos-lista').style.display = 'block';
            document.getElementById('projeto-detalhe').style.display = 'none';
        }

        async function mudarStatus() {
            if (!projetoAtual) return;
            projetoAtual.status = document.getElementById('det-status').value;
            await db.update('projetos', projetoAtual);
            showAlert('Status atualizado', 'success');
        }

        async function excluirProjeto() {
            if (!projetoAtual) return;
            if (!confirm('Tem certeza que deseja excluir este projeto?')) return;
            await db.delete('projetos', projetoAtual.id);
            showAlert('Projeto excluído', 'success');
            voltarLista();
            loadProjetos();
        }

        function abrirModalNovo() {
            document.getElementById('novoNome').value = '';
            document.getElementById('novoDescricao').value = '';
            document.getElementById('modal-novo').classList.add('active');
        }

        async function criarProjeto() {
            const nome = document.getElementById('novoNome').value.trim();
            if (!nome) { showAlert('Digite o nome do projeto', 'warning'); return; }
            const podeUsar = await license.podeUsar('criar_projeto');
            if (!podeUsar) { showAlert('Limite de projetos atingido. Faça upgrade.', 'warning'); return; }
            await db.add('projetos', { nome, descricao: document.getElementById('novoDescricao').value, status: 'em andamento', terrenoIds: [], criadoEm: new Date().toISOString() });
            await license.registrarUso('projeto');
            fecharModal('modal-novo');
            showAlert('Projeto criado com sucesso!', 'success');
            loadProjetos();
        }

        function fecharModal(id) { document.getElementById(id).classList.remove('active'); }

        function showAlert(message, type = 'info') {
            const container = document.getElementById('alert-container');
            const icons = { info: 'info-circle', success: 'check-circle', danger: 'exclamation-circle', warning: 'exclamation-triangle' };
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `<i class="fas fa-${icons[type]}"></i> ${message}`;
            container.appendChild(alert);
            setTimeout(() => alert.remove(), 5000);
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        function checkResponsive() {
            const toggle = document.getElementById('menu-toggle');
            if (window.innerWidth <= 768) { toggle.style.display = 'grid'; } else { toggle.style.display = 'none'; }
        }
        window.addEventListener('resize', checkResponsive);
    </script>
</body>
</html>
